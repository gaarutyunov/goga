# goga — reusable "run the integration tests" composite action.
#
# Downstream projects pin this as:
#   uses: gaarutyunov/goga/.github/actions/go-test-integration@<ref>
#
# The sibling of `go-test`, and deliberately shaped like it: same input names,
# same JSON-driven step summary, same artifact conventions. Learn one and you
# know the other. It differs in exactly the three ways that a container-backed
# suite needs and a unit suite does not:
#
#   a build tag  — integration tests sit behind a `//go:build` constraint so the
#                  default `go test ./...` never tries to start a container. The
#                  tag has to be named somewhere, and this is that somewhere.
#   a timeout    — a container that never becomes ready hangs the test binary.
#                  Without an explicit -timeout the run sits on the runner until
#                  the job limit expires, which turns a five-minute diagnosis
#                  into a six-hour one.
#   artifacts on failure — a red container run's logs *are* the diagnosis. The
#                  upload step is therefore `if: always()`, not gated on success.
#
# No container-runtime setup step: GitHub-hosted Ubuntu runners already have a
# working Docker daemon, which is what testcontainers-go needs. Adding a
# `services:` block or a Docker install here would be redundant.
name: Go integration test
description: >-
  Run the build-tag-gated integration tests with the race detector, atomic
  coverage and an explicit timeout, render a pass/fail/skip summary into the job
  summary, and upload the coverage profile and the raw test log even when the
  run fails. Assumes a Go toolchain is already on PATH — run the companion
  `setup-go` action first.

inputs:
  build-tags:
    description: >-
      Comma-separated build tags selecting the integration tests. Defaults to
      the tag goga's own container tests carry, "integration". Override it if
      your project spells the constraint differently.
    required: false
    default: integration
  packages:
    description: >-
      Package pattern to test. Note that -tags is additive: the tagged files
      become visible, but the untagged tests in the selected packages still run.
      Narrow this if re-running the unit suite under the integration job is not
      acceptable.
    required: false
    default: ./...
  timeout:
    description: >-
      Value for `go test -timeout`, applied per test binary. Go's own default is
      10m, which is calibrated for unit tests: a container suite can spend the
      first minutes of that budget pulling images on a cold runner cache before
      a single test body executes. The default here is 15m — enough headroom for
      a cold pull plus a real suite, and short enough that a wedged container
      fails in minutes instead of occupying the runner until the job limit.
    required: false
    default: 15m
  coverage-file:
    description: >-
      Path of the coverage profile to write, relative to working-directory. The
      default differs from the unit action's on purpose: when both jobs' outputs
      end up side by side, distinct names are what keeps one from shadowing the
      other.
    required: false
    default: coverage-integration.out
  log-file:
    description: >-
      Path of the raw `go test -json` event stream, relative to
      working-directory. Uploaded alongside the coverage profile so that a
      failed run's container and test output survives the job.
    required: false
    default: integration-test.json
  working-directory:
    description: Directory to run the tests in, relative to the repository root.
    required: false
    default: "."
  args:
    description: Extra flags appended to the `go test` invocation (e.g. -count=1).
    required: false
    default: ""
  upload-artifact:
    description: Upload the coverage profile and test log as a workflow artifact.
    required: false
    default: "true"
  artifact-name:
    description: >-
      Name of the artifact. Must be unique within a workflow run, so it must not
      collide with the unit job's artifact and a matrix build has to vary it per
      leg (e.g. coverage-integration-linux, coverage-integration-macos).
    required: false
    default: coverage-integration

outputs:
  coverage-percent:
    description: Total statement coverage, as reported by `go tool cover -func`.
    value: ${{ steps.cover.outputs.percent }}
  tests-passed:
    description: Number of tests that passed.
    value: ${{ steps.test.outputs.passed }}
  tests-failed:
    description: Number of tests that failed.
    value: ${{ steps.test.outputs.failed }}

runs:
  using: composite
  steps:
    - name: Run integration tests
      id: test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Inputs travel through env rather than being interpolated into the script
      # body: a `${{ }}` expansion inside `run:` is a script-injection hole when
      # the value is attacker-controlled (a branch name, a PR title).
      env:
        GOGA_PACKAGES: ${{ inputs.packages }}
        GOGA_BUILD_TAGS: ${{ inputs.build-tags }}
        GOGA_COVERAGE_FILE: ${{ inputs.coverage-file }}
        GOGA_LOG_FILE: ${{ inputs.log-file }}
        GOGA_TIMEOUT: ${{ inputs.timeout }}
        GOGA_EXTRA_ARGS: ${{ inputs.args }}
      run: |
        # GitHub invokes `shell: bash` as `bash -eo pipefail`. -e has to go:
        # a failing test must still reach the summary and artifact steps below.
        set +e
        set -uo pipefail

        # Empty-safe -tags: a bare `-tags=` is rejected by some toolchains. An
        # empty value is also a legitimate choice here — it means "the caller
        # gates integration tests some other way" — so it is not an error.
        tagflag=()
        if [ -n "$GOGA_BUILD_TAGS" ]; then
          tagflag=("-tags=$GOGA_BUILD_TAGS")
        fi
        extra=()
        if [ -n "$GOGA_EXTRA_ARGS" ]; then
          # Word-split deliberately: `args` is a flag list, not a single value.
          read -r -a extra <<< "$GOGA_EXTRA_ARGS"
        fi

        # Empty-safe for the same reason as -tags: a caller who explicitly
        # blanks the input gets go's own default rather than an invalid
        # `-timeout=`. Blanking it is a choice, not a mistake, so it is not
        # an error — but it does give up the guarantee this action exists for,
        # so say so in the log.
        timeoutflag=()
        if [ -n "$GOGA_TIMEOUT" ]; then
          timeoutflag=("-timeout=$GOGA_TIMEOUT")
        else
          echo "::warning::timeout input is empty; go's 10m default applies."
        fi

        # Unlike the unit action, the event stream is kept in the working
        # directory rather than RUNNER_TEMP: it is an artifact here, not just a
        # parser input.
        events="$GOGA_LOG_FILE"

        # Output goes to a file rather than through a pipe so that $? is go
        # test's own exit status, not the parser's. The human-readable rendering
        # is produced below from the same JSON, which keeps the log clean.
        set -x
        go test "${tagflag[@]}" \
          -race \
          -covermode=atomic \
          -coverprofile="$GOGA_COVERAGE_FILE" \
          "${timeoutflag[@]}" \
          -json \
          "${extra[@]}" \
          "$GOGA_PACKAGES" > "$events"
        status=$?
        set +x

        # python3 is preinstalled on every GitHub-hosted runner; the script uses
        # nothing beyond the standard library, so there is no extra dependency
        # to install (no gotestsum, no jq).
        python3 - "$events" <<'PY'
        import json, os, sys
        from collections import Counter

        counts = Counter()
        failures = []          # (package, test)
        output = {}            # (package, test) -> [lines]
        pkg_output = {}        # package -> [lines]
        failed_pkgs = []       # packages whose own result was "fail"
        pkgs_with_failing_test = set()
        build_errors = []

        with open(sys.argv[1], encoding="utf-8", errors="replace") as fh:
            for line in fh:
                line = line.strip()
                if not line or not line.startswith("{"):
                    # A build failure can emit plain text before any JSON event.
                    if line:
                        build_errors.append(line)
                    continue
                try:
                    ev = json.loads(line)
                except json.JSONDecodeError:
                    build_errors.append(line)
                    continue

                action = ev.get("Action")
                pkg = ev.get("Package", "")
                test = ev.get("Test")

                if action == "output":
                    if test:
                        output.setdefault((pkg, test), []).append(ev.get("Output", ""))
                    else:
                        pkg_output.setdefault(pkg, []).append(ev.get("Output", ""))
                if test is None:
                    # Package-level event. A timeout or a panic in a fixture
                    # kills the binary before the running test ever emits its
                    # own "fail", so the package result is the only trace left —
                    # and for a container suite that is the common failure, not
                    # an exotic one. Record it so the summary can surface it.
                    if action == "fail":
                        failed_pkgs.append(pkg)
                    continue
                if action in ("pass", "fail", "skip"):
                    counts[action] += 1
                    if action == "fail":
                        failures.append((pkg, test))
                        pkgs_with_failing_test.add(pkg)

        # Packages that died without any individual test being blamed: timeout,
        # panic in TestMain, container that never came up.
        silent_pkgs = [p for p in failed_pkgs if p not in pkgs_with_failing_test]

        total = counts["pass"] + counts["fail"] + counts["skip"]
        icon = "❌" if (counts["fail"] or build_errors or silent_pkgs) else "✅"

        lines = [
            f"## {icon} Go integration test",
            "",
            "| Result | Count |",
            "| --- | ---: |",
            f"| Passed | {counts['pass']} |",
            f"| Failed | {counts['fail']} |",
            f"| Skipped | {counts['skip']} |",
            f"| **Total** | **{total}** |",
            "",
        ]

        if build_errors:
            lines += [
                "### Build / setup errors",
                "",
                "```",
                *build_errors[:80],
                "```",
                "",
            ]

        if silent_pkgs:
            lines += [
                "### Packages that failed without a failing test",
                "",
                "A timeout, a panic in `TestMain`, or a container that never "
                "became ready. The package output below is the whole diagnosis.",
                "",
            ]
            for pkg in silent_pkgs:
                lines.append(f"<details open><summary><code>{pkg}</code></summary>")
                lines.append("")
                lines.append("```")
                lines.extend(l.rstrip("\n") for l in pkg_output.get(pkg, [])[-80:])
                lines.append("```")
                lines.append("")
                lines.append("</details>")
                lines.append("")

        if failures:
            lines.append("### Failures")
            lines.append("")
            for pkg, test in failures:
                lines.append(f"<details><summary><code>{pkg}</code> — <code>{test}</code></summary>")
                lines.append("")
                lines.append("```")
                # Tail the output: a failing table-driven test can be very long.
                lines.extend(l.rstrip("\n") for l in output.get((pkg, test), [])[-60:])
                lines.append("```")
                lines.append("")
                lines.append("</details>")
                lines.append("")

        summary = os.environ.get("GITHUB_STEP_SUMMARY")
        if summary:
            with open(summary, "a", encoding="utf-8") as fh:
                fh.write("\n".join(lines) + "\n")

        # Same information on stdout, so the log alone is enough to triage.
        print(f"tests: {counts['pass']} passed, {counts['fail']} failed, {counts['skip']} skipped")
        for pkg in silent_pkgs:
            print(f"::error::FAIL {pkg} (no individual test failed — timeout, panic or fixture error)")
            for l in pkg_output.get(pkg, [])[-40:]:
                sys.stdout.write(l)
        for pkg, test in failures:
            print(f"::error::FAIL {pkg} {test}")
            for l in output.get((pkg, test), [])[-40:]:
                sys.stdout.write(l)

        out = os.environ.get("GITHUB_OUTPUT")
        if out:
            with open(out, "a", encoding="utf-8") as fh:
                fh.write(f"passed={counts['pass']}\n")
                fh.write(f"failed={counts['fail']}\n")
                fh.write(f"skipped={counts['skip']}\n")
        PY

        exit $status

    - name: Coverage total
      id: cover
      # Runs even on failure so a red build still reports where coverage stood.
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GOGA_COVERAGE_FILE: ${{ inputs.coverage-file }}
      run: |
        set +e
        set -uo pipefail
        if [ ! -s "$GOGA_COVERAGE_FILE" ]; then
          echo "No coverage profile at $GOGA_COVERAGE_FILE — skipping."
          echo "percent=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        total="$(go tool cover -func="$GOGA_COVERAGE_FILE" | tail -n 1 | awk '{print $NF}')"
        echo "total coverage: $total"
        echo "percent=$total" >> "$GITHUB_OUTPUT"
        {
          echo ""
          echo "**Total coverage (integration):** $total"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload integration artifacts
      # `always()`, emphatically not `success()`: the reason this action exists
      # is that a red container run's logs used to be thrown away with the
      # runner. A green run's artifact is a nicety; a red run's is the point.
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.working-directory }}/${{ inputs.coverage-file }}
          ${{ inputs.working-directory }}/${{ inputs.log-file }}
        # A missing profile means the build failed before any test ran; warn
        # rather than compounding the failure with an artifact error.
        if-no-files-found: warn
        retention-days: 7
