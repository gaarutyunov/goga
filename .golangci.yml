# golangci-lint configuration for goga — and the template goga ships to every
# project that adopts it.
#
# Two audiences, one file. goga lints itself with exactly the rule set it asks
# adopters to use, because a template its own author does not run is a template
# nobody has tested. Every choice below is commented for that reason: an adopter
# copying this file should be able to tell which rules are the house position
# and which are merely the defaults.
#
# ---------------------------------------------------------------------------
# THE TRAP, read this before editing
# ---------------------------------------------------------------------------
# golangci-lint silently ignores unknown keys under `settings`. A misspelled
# rule name, a key from a different linter, a v1 key left behind in a v2 file —
# none of them is an error. The linter simply reports zero issues and looks
# perfectly healthy, and you find out months later that the rule you thought
# was guarding the codebase never ran.
#
# So: never add a rule here and assume it works. Prove it. Write a scratch file
# that violates the rule, run `golangci-lint run ./...`, see the finding, delete
# the scratch file. `golangci-lint config verify` catches a *malformed* config
# against the bundled JSON schema, which is necessary but not sufficient — it
# validates shape, not that a rule you configured actually fires.
#
# The rules below were proven that way when this file was written.
# ---------------------------------------------------------------------------

version: "2"

run:
  # goga targets Go 1.27 (design D17). Telling golangci-lint the language
  # version keeps its analyzers from suggesting rewrites that predate it.
  go: "1.27"
  timeout: 5m
  # Test files are code too: the conventions this file enforces — no viper, no
  # archived wire, no golang-migrate — apply to them as much as to the package.
  tests: true

linters:
  # `standard` is errcheck + govet + ineffassign + staticcheck + unused. Start
  # from it rather than from `all`: a rule set that fails on correct code gets
  # switched off wholesale, and then none of it is enforcing anything.
  default: standard
  enable:
    # The house import bans. This is the load-bearing entry in the file.
    - depguard
    # An error compared with == instead of errors.Is, or a type-asserted error,
    # both break the moment anything in the chain starts wrapping. goga's own
    # convention (CONVENTIONS.md §1.5) is that errors wrap with %w and that
    # callers branch with errors.Is/As, so this is that convention's enforcer.
    - errorlint
    # A response body that is never closed leaks a connection. goga/client and
    # goga/serve (M2, M10) will make HTTP a first-class surface; the rule is
    # cheap and has no false positives worth the name.
    - bodyclose
    # A context.Context that is not the first parameter, or a struct field
    # holding one. goga passes ctx through every surface (CONVENTIONS.md §1.4),
    # so the shape has to hold.
    - containedctx
    - contextcheck
    # A bare `x.(T)` panics with a message naming two types and nothing else if
    # the invariant behind it is ever broken by a later edit. The checked form
    # costs two lines and lets the failure name the module and the invariant, in
    # the house error shape. This is enforced in tests too: a test that panics
    # on a bad assertion reports the assertion, not the behaviour under test.
    - forcetypeassert
    # The broad style linter: naming, early returns, error conventions. Its rule
    # set is pinned explicitly under `settings.revive` rather than inherited, and
    # every rule in it was proven to fire — a revive block is the easiest place
    # in this file to accumulate rules nobody checked.
    - revive
    # goga/lint's own analyzers — currently gogalayout (flat layout: no pkg/ and
    # no internal/). COMMENTED OUT ON PURPOSE, together with the `custom:` block
    # under `settings:` below. Uncomment BOTH or NEITHER.
    #
    # `type: module` means the linter is compiled *into* the golangci-lint
    # binary. The stock binary from `go install` does not contain goga/lint and
    # cannot load it: enabling this there fails the whole run before a single
    # file is read. Build the binary that does contain it with
    #
    #     golangci-lint custom      # reads .custom-gcl.yml, writes ./bin/goga-gcl
    #
    # and run `./bin/goga-gcl run ./...` with both blocks uncommented. A project
    # linting with the stock binary leaves them alone and still gets every rule
    # above.
    # - goga
  settings:
    # The other half of the goga/lint enablement; see the comment beside `- goga`
    # in `enable:` above. Uncomment both together.
    # custom:
    #   goga:
    #     type: module
    #     description: goga house conventions — currently gogalayout (flat layout, no pkg/ and no internal/).
    #     original-url: github.com/gaarutyunov/goga
    #     settings:
    #       # The module whose layout is checked. An adopting project sets its
    #       # own module path here. Unknown keys in this block are rejected
    #       # rather than ignored: goga/lint decodes its settings with
    #       # DisallowUnknownFields precisely because golangci-lint does not.
    #       module-prefix: github.com/gaarutyunov/goga
    depguard:
      rules:
        house:
          # These are IMPORT PATHS, matched against what a source file actually
          # writes in its import block — not entries in the module graph. The
          # distinction is the reason the rule is shaped this way: a dependency
          # can sit in go.mod transitively without any file importing it (viper
          # is the usual example, arriving indirectly through tooling), and
          # banning it at that level would report something nobody wrote and
          # nobody can remove. What the project controls is the import.
          #
          # `pkg` is a PREFIX match, which the third entry relies on:
          # `github.com/golang-migrate/migrate` also catches the real import
          # path `github.com/golang-migrate/migrate/v4`. Verified, not assumed.
          # The bans are correspondingly narrow — `github.com/google/wire` does
          # not catch `github.com/goforj/wire`, the fork that must stay allowed.
          deny:
            - pkg: github.com/spf13/viper
              desc: koanf is the house configuration library — use goga/config (see .claude/rules/go-cli-koanf.md)
            - pkg: github.com/google/wire
              desc: archived upstream — use github.com/goforj/wire, the maintained fork
            - pkg: github.com/golang-migrate/migrate
              desc: goose is the house migration engine — use goga/migrate
        # goga/telemetry owns the OpenTelemetry SDK. A project that builds its
        # own provider stack beside goga's ends up with two TracerProviders,
        # two shutdown paths and two resources, and the spans it emits land in
        # whichever one the global happened to be set to last — a failure that
        # shows up as missing telemetry rather than as an error.
        #
        # The api half (go.opentelemetry.io/otel, /trace, /metric, /log,
        # /attribute) is deliberately NOT banned: instrumenting code is what
        # every package here is supposed to do. It is the SDK — the
        # construction half — that belongs to one place.
        telemetry-owns-the-otel-sdk:
          # An IMPORT-PATH prefix again, and the prefix match is the point:
          # `go.opentelemetry.io/otel/sdk` catches sdk/trace, sdk/metric,
          # sdk/log and sdk/resource, which is every way a provider stack gets
          # built. Verified by scratch file, not assumed.
          #
          # `files` is a list of glob patterns against the file's absolute
          # path, and a leading ! excludes. Excluding telemetry/ rather than
          # allow-listing it keeps the rule stated as what it forbids. The
          # pattern covers telemetry/'s test files too: the mocks under
          # telemetry/ are generated against sdk interfaces (mock_spanexporter_test.go
          # and friends), and every other sdk import in the repository today is
          # in that same directory — checked before the ban was written, so it
          # is not banning anything correct.
          files:
            - "!**/telemetry/**"
          deny:
            - pkg: go.opentelemetry.io/otel/sdk
              desc: goga/telemetry owns the OpenTelemetry SDK — use goga/telemetry rather than building a second provider stack (the otel API packages remain importable everywhere)
    errcheck:
      # check-blank is deliberately left off (its default). It reports `_ = f()`,
      # which is the *explicit* form — the one a reviewer can see and weigh. The
      # oversight worth catching is a return value ignored silently, and that is
      # errcheck's default behaviour. Turning check-blank on penalises the habit
      # this file wants to encourage.
      check-blank: false
    revive:
      # revive with no `rules` runs a default set. Pinning the list is the point:
      # an inherited default silently changes with the linter version, and the
      # unknown-key trap at the top of this file means a rule that stopped
      # existing would take its enforcement with it and say nothing. Every rule
      # here was proven to fire.
      #
      # One of revive's defaults is deliberately absent: `unused-parameter`,
      # which fires on every method that satisfies an interface it does not need
      # all of.
      #
      # `exported` is NOT absent, and the temptation to drop it should be
      # resisted. It is the rule that keeps goga's exported surface documented,
      # which for a framework other projects embed is the surface that matters
      # most. A one-line `Is` or `Error` method is not an exception: a caller
      # reading `errors.Is(err, ErrDuplicateName)` wants to be told which
      # sentinel the method answers for, and only the method's own comment says
      # so.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: exported
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
    govet:
      enable:
        # The one govet analyzer not on by default that is worth the cost: it
        # catches a lock or a value with a Lock method being copied.
        - copylocks
        # A struct field tag that does not parse, which silently produces the
        # wrong JSON key.
        - structtag
        # Wrong verb / wrong arity in a formatting call. goga's error convention
        # is built on fmt.Errorf, so this guards the convention's own mechanism.
        - printf

  exclusions:
    # `strict` means a file must carry the canonical "Code generated by ... DO
    # NOT EDIT." line to be treated as generated. goga generates a lot (D-codegen:
    # oapi-codegen, sqlc, wire, mockgen), and lax matching would let a
    # hand-written file opt itself out of every rule by shape of its header.
    generated: strict
    # Report a `//nolint` that no longer suppresses anything. A stale
    # suppression is the same failure mode as the unknown-key trap above: it
    # looks like a guarded exception and is actually nothing.
    warn-unused: true
    # No `rules:` here on purpose. The obvious entry to write is an exclusion
    # for testdata/ — lint/testdata holds analysistest fixtures that are
    # deliberately wrong — but the go tool never loads a package under testdata,
    # so `./...` does not reach them and the rule would exclude nothing. It was
    # written, measured at zero, and removed: golangci-lint reports
    # "Skipped 0 issues by rules" for a dead exclusion, which is the same class
    # of lie as the unknown-key trap at the top of this file. Add an exclusion
    # only after seeing the issue it suppresses.

# In v2, formatting is its own section: these do not run as linters, and
# `golangci-lint fmt` applies them. Both, in this order — gofmt normalises the
# code, goimports then groups and orders the import block.
formatters:
  enable:
    - gofmt
    # goimports runs with no settings. In particular local-prefixes is unset:
    # grouping goga's own imports into a third block is a taste call, not a
    # house rule, and an empty `goimports:` key here is a config error rather
    # than a no-op — `golangci-lint config verify` rejects it.
    - goimports
  settings:
    gofmt:
      # -s: rewrite redundant composite literals and slice expressions.
      simplify: true
